services:
  postgres:
    image: postgres:16-alpine
    container_name: rental_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=rentalmotorcycledb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  mongo:
    image: mongo:latest
    container_name: rental_mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rental_rabbitmq
    ports:
      - "5672:5672"  
      - "15672:15672" 
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app-network

  rentalmotorcycle.presentation.webapi:
    image: ${DOCKER_REGISTRY-}rentalmotorcyclepresentationwebapi
    build:
      context: ..
      dockerfile: RentalMotorcycle/src/RentalMotorcycle.Presentation.WebAPI/Dockerfile
    environment: 
      - ConnectionStrings__rentalmotorcycledb=Host=postgres;Port=5432;Database=rentalmotorcycledb;Username=postgres;Password=postgres
      - ConnectionStrings__RabbitMQ=amqp://guest:guest@rabbitmq:5672
      - MongoDBSettings__ConnectionString=mongodb://admin:admin@mongo:27017
      - MongoDBSettings__DatabaseName=rentalmotorcycledb-read
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - mongo
      - rabbitmq
    networks: 
      - app-network

volumes:
  postgres_data:
  mongo_data:
  rabbitmq_data:

networks:
  app-network:
    driver: bridge
